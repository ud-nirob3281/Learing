<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNKNOWN</title>
</head>
<style>
  .content {
    display: none;
  }

  .active {
    display: block;
  }

  .activeColor {
    background: blue;
    color: white;
  }

  button {
    background: gray;
    color: black;
  }
</style>

<body>
  <div class="tabs">
    <div class="tab-headers">
      <button class="tab" id="1">Home</button>
      <button class="tab" id="2">About</button>
      <button class="tab" id="3">Contact</button>
    </div>
    <div class="tab-contents">
      <div class="content" id="1">Welcome to Home</div>
      <div class="content" id="2">About us page here.</div>
      <div class="content" id="3">Contact info displayed here.</div>
    </div>
  </div>
</body>
<script>
  const tabHead = document.querySelector('.tab-headers');
  const contentHead = document.querySelectorAll('.content');

  tabHead.addEventListener('click', e => {
    if (e.target.tagName === 'BUTTON') {
      tabHead
        .querySelectorAll('button')
        .forEach(btn => btn.classList.remove('activeColor'));

      e.target.classList.add('activeColor');
      console.log(`Tab changed to: ${e.target.textContent}`);

      contentHead.forEach(value => {
        if (value.id === e.target.id) {
          value.classList.add('active');
        } else {
          value.classList.remove('active');
        }
      });
    }
  });

  document.addEventListener('keypress', e => {
    tabHead.querySelectorAll('button').forEach(btn => {
      if (e.key === btn.id) {
        btn.click();
      }
    });
  });
</script>

</html>
